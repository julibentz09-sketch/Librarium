name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y probar
        run: |
          chmod +x mvnw
          ./mvnw -B package

      - name: Armar el sitio
        run: |
          mkdir -p sitio
          cp -r src/main/resources/web/. sitio/
          java -cp target/librarium.jar py.librarium.ExportadorSitio sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
